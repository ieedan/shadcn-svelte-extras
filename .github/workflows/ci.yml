name: CI

on:
  pull_request:
    branches: [main]

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install

      # the lint step reads registry.json to know which files are shipped by the registry
      - name: Build registry, generate i18n files and Lint
        run: pnpm registry:build && pnpm generate-i18n && pnpm lint

      - name: Check
        run: pnpm check
